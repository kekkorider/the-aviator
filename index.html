<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Aviator</title>
  </head>
  <body>
    <div id="app">
      <div id="main-menu" style="visibility: hidden;">
        <div id="main-menu-heading">
          <h1 id="main-menu-title" class="font-heading">
            <span>The Aviator</span>
            <span class="main-menu-title-pill" data-index="1" data-js-pill aria-hidden="true"></span>
            <span class="main-menu-title-pill" data-index="2" data-js-pill aria-hidden="true"></span>
            <span class="main-menu-title-pill" data-index="3" data-js-pill aria-hidden="true"></span>
          </h1>
          <span id="main-menu-subtitle" class="font-heading">
            <span id="main-menu-subtitle-copy">Remake</span>
          </span>
        </div>

        <div id="main-menu-buttons">
          <button id="main-menu-button-play" style="transform: rotate(0.01deg)" disabled>
            <span>Start game</span>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
              <path stroke="#f2ecd8" stroke-linecap="round" stroke-width="2" d="M4.39 3.33q-.22.39-.22.84v11.66a1.67 1.67 0 0 0 2.5 1.44l10-5.83a1.67 1.67 0 0 0 0-2.88l-10-5.83a1.67 1.67 0 0 0-2.28.6Z"/>
            </svg></button>
        </div>
      </div>

      <div id="hud">
        <div id="hud-top-bar">
          <div id="hud-score">
            <span id="hud-score-label">Score</span>
            <span id="hud-score-value">00,000,000</span>
          </div>

          <div id="hud-lives" data-lives="3">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 25 22">
              <path d="M12.5 0c1.06 0 1.6 1.01 1.6 2.03l.53 5.06L22.6 8.1c3.19.5 3.19 3.04 0 3.55l-7.98.5-.53 4.06 4.25 3.03c1.07 1.02.53 2.03-1.06 2.03l-4.79-2.03-4.79 2.03c-1.6 0-2.12-1.01-1.06-2.03l4.26-3.03-.54-4.06-7.98-.5C-.8 11.15-.8 8.6 2.4 8.1l7.98-1.01.54-5.06C10.9 1 11.44 0 12.5 0"/>
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 25 22">
              <path d="M12.5 0c1.06 0 1.6 1.01 1.6 2.03l.53 5.06L22.6 8.1c3.19.5 3.19 3.04 0 3.55l-7.98.5-.53 4.06 4.25 3.03c1.07 1.02.53 2.03-1.06 2.03l-4.79-2.03-4.79 2.03c-1.6 0-2.12-1.01-1.06-2.03l4.26-3.03-.54-4.06-7.98-.5C-.8 11.15-.8 8.6 2.4 8.1l7.98-1.01.54-5.06C10.9 1 11.44 0 12.5 0"/>
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 25 22">
              <path d="M12.5 0c1.06 0 1.6 1.01 1.6 2.03l.53 5.06L22.6 8.1c3.19.5 3.19 3.04 0 3.55l-7.98.5-.53 4.06 4.25 3.03c1.07 1.02.53 2.03-1.06 2.03l-4.79-2.03-4.79 2.03c-1.6 0-2.12-1.01-1.06-2.03l4.26-3.03-.54-4.06-7.98-.5C-.8 11.15-.8 8.6 2.4 8.1l7.98-1.01.54-5.06C10.9 1 11.44 0 12.5 0"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
